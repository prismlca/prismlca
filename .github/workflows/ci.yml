# Checks on every pull request, and on demand (Actions → CI → Run workflow, or `gh workflow run ci.yml --ref
# main`): the same tests, lint and notices check the release workflow starts with, plus the end-to-end tests
# and the whole suite on Windows, without building installers — that stays the release's work, on a tag.
# Not on every push to main: work on main is checked locally before each commit, and this run (an hour, for
# Windows) is started deliberately — before every release, as the release check recommends. Pull requests
# from forks run with a read-only token and, by the organisation's setting, only after the maintainer
# approves the run.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

# A newer push to a pull request makes its older run pointless. A run started by hand is never cancelled by
# the next one, which waits instead: it is the check a release waits for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Tests, lint, notices
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev --extra build
      # Before the backend tests: the third-party notices test reads frontend/node_modules.
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Backend lint and tests
        working-directory: backend
        run: |
          uv run ruff check src tests scripts
          uv run pytest -n auto -q --cov --cov-report=json --cov-report=html
      - name: Third-party notices are current
        working-directory: backend
        run: uv run python scripts/third_party_notices.py --check
      - name: Frontend typecheck, lint and tests
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npx vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=html
      # A report on the run's summary page and as an artifact — deliberately not a gate (no threshold).
      - name: Coverage report
        run: node .github/scripts/coverage-summary.mjs frontend/coverage/coverage-summary.json backend/coverage.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            frontend/coverage/
            backend/htmlcov/
          retention-days: 14
      # The start-up self-check the release runs on its packages, here on the source build: the backend
      # answers, the real window loads the renderer through the preload, and a request from the page
      # comes back through the bridge (frontend/src/main/diagnostics/smokeWindow.ts).
      - name: The app starts and its window answers
        working-directory: frontend
        run: |
          sudo apt-get install -y --no-install-recommends xvfb > /dev/null
          npm run build
          PRISM_SMOKE=1 XDG_CONFIG_HOME="$RUNNER_TEMP/cfg" PRISM_DATA_DIR="$RUNNER_TEMP/data" \
            BRIGHTWAY2_DIR="$RUNNER_TEMP/data/brightway" xvfb-run -a npx electron . --no-sandbox

  # The built app as a person uses it: real Electron, real renderer and preload, the Python backend it
  # spawns, driven by Playwright through the visible interface (frontend/e2e/). A job of its own, so a red
  # end-to-end run never hides the result of the unit suites. Screenshots and the app's output of a failed
  # test are the `e2e-report` artifact.
  e2e:
    name: End-to-end
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: End-to-end tests
        working-directory: frontend
        run: |
          sudo apt-get install -y --no-install-recommends xvfb > /dev/null
          npm run build
          xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

  # The same suites on Windows, where most of our users run the app: paths, file locking, process handling
  # and worker start-up behave differently there, and until now only the release build ever ran on it.
  # GitHub-hosted on purpose — the self-hosted Windows runner signs releases, and only the release workflow
  # may run on it. Lint, typecheck and notices are platform-independent and stay with the Linux job.
  test-windows:
    name: Tests on Windows
    runs-on: windows-2025
    # The backend suite alone takes 45 minutes and more here (Linux: 4) — process start-up and SQLite on
    # NTFS — and the whole job between 52 and 76 minutes, depending on the runner. The limit leaves room for
    # a slow runner, so that a job is never cancelled with every test still passing.
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # The runner's git converts line endings to CRLF on checkout; our golden files, notices and
      # byte-for-byte comparisons are written with LF, as every other checkout has them.
      - name: Check out with the repository's own line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev --extra build
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      # The short checks first and the backend suite (most of the hour) last, so a finding in the app's
      # start, window or quit is there in minutes. Each check runs even when the one before it failed, so
      # one run shows everything Windows does differently.
      - name: Frontend tests
        working-directory: frontend
        run: npx vitest run
      - name: The app starts and its window answers
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          npm run build
          PRISM_SMOKE=1 PRISM_DATA_DIR="$RUNNER_TEMP/data" BRIGHTWAY2_DIR="$RUNNER_TEMP/data/brightway" \
            npx electron . --user-data-dir="$RUNNER_TEMP/cfg"
      # The end-to-end suite here too: native dialogs, paths, and starting and ending the backend are where
      # Windows has behaved differently before. The build is the one the window check just made.
      - name: End-to-end tests
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report-windows
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
      - name: Backend tests
        if: ${{ !cancelled() }}
        working-directory: backend
        run: uv run pytest -n auto -q
