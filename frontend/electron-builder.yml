appId: de.prismlca.app
productName: PrismLCA
copyright: © Jonas Harth

directories:
  output: release
  buildResources: build

files:
  - out/**
  # Read at runtime through `?asset` imports (main/licence.ts, the window icon). Without them only
  # out/** is packed, and the licence and notices buttons open nothing in an installed app.
  - resources/LICENSE.txt
  - resources/THIRD-PARTY-NOTICES.md
  - resources/icon.png

# The OS opens these with its own viewer, which cannot read inside app.asar (licence.ts uses
# `?asset&asarUnpack` to point at the unpacked copies).
asarUnpack:
  - resources/LICENSE.txt
  - resources/THIRD-PARTY-NOTICES.md

# Ship the PyInstaller onedir backend bundle as resources/backend.
# Build the backend first:  cd ../backend && uv run pyinstaller prism_backend.spec --noconfirm
extraResources:
  - from: ../backend/dist/prism-lca-backend
    to: backend
    filter:
      - "**/*"
  # Hunspell dictionaries for the five report languages — spell checking works offline and never
  # contacts Google's CDN (see src/main/spellcheck.ts). Licences: resources/dictionaries/LICENSES.md.
  - from: resources/dictionaries
    to: dictionaries

win:
  target:
    - nsis
  # Explicit, like linux.icon: build/ (electron-builder's default icon place) is gitignored, so a CI
  # build would otherwise ship Electron's own icon. 512×512 PNG, converted to .ico by the builder.
  icon: resources/icon.png
  # Releases are signed on the release VM with Certum Open Source Code Signing: the hook signs only our own
  # executables and only in release builds, so a local build stays unsigned. One SHA-256 signature per file.
  signtoolOptions:
    sign: ./scripts/release/sign-windows.mjs
    signingHashAlgorithms:
      - sha256
    # The certificate subject exactly as Windows shows it. It goes into app-update.yml, and every installed
    # copy then accepts only installers signed with it: it changes only with a planned publisher change, and a
    # renewal must keep it letter for letter.
    publisherName: 'CN=Open Source Developer Jonas Harth, O=Open Source Developer, L=Heidelberg, S=Baden-Württemberg, C=DE'

linux:
  # Order matters: deb and rpm each write resources/package-type into the shared unpacked folder before they
  # pack it, so each carries its own name; the AppImage is built before both and carries none.
  target:
    - AppImage
    - deb
    - rpm
  category: Science
  icon: resources/icon.png # committed; build/ is gitignored
  maintainer: Jonas Harth <harthjonas@gmail.com>

deb:
  # electron-builder's own list plus ALSA: Electron links libasound.so.2 and does not start without it. Desktops
  # have it anyway, minimal systems do not. Ubuntu 24.04's libasound2t64 provides libasound2, so one name
  # covers both generations; the release workflow checks the package says so.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2

rpm:
  # electron-builder's own list plus libsecret (as in the deb) and ALSA, for the same reason as there. The
  # "(a or b)" entries take the Fedora name or the openSUSE one.
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - (libsecret or libsecret-1-0)
    - (alsa-lib or libasound2)
  # No /usr/lib/.build-id links: Electron apps ship identical binaries (chrome-sandbox, libffmpeg.so), and the
  # links of two such packages collide when both are installed.
  fpm:
    - --rpm-rpmbuild-define
    - _build_id_links none

nsis:
  # No spaces: GitHub turns them into dots when a file is uploaded, while latest.yml names the installer with
  # dashes — the update check would then ask for a file that is not there (it happened to 0.9.2).
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: resources/installer.nsh

# Update feed: GitHub Releases. The app only asks it when the user clicks "Check for updates"
# (Settings → About, src/main/updater.ts) — never on its own.
# Repository: github.com/prismlca/prismlca
publish:
  provider: github
  owner: prismlca
  repo: prismlca
